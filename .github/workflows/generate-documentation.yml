name: "generate-documentation"

# Runs on manual dispatch inside nimbus-design-system, and is also callable
# as a reusable workflow — publish.yml chains into it directly instead of
# dispatching it by workflow ID over the API with a PAT.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  generate-documents:
    runs-on: ubuntu-latest
    # Needed for create-pull-request to push the docs branch and open the PR.
    permissions:
      contents: write
      pull-requests: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node-deps

      - name: Build tokens
        run: yarn build:tokens

      - name: Build icons
        run: yarn build:icons

      - name: Generate documents
        run: yarn build:docs

      - name: Create documentation PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: updated documentation for components and subcomponents [skip ci]"
          title: "chore: update component documentation"
          body: |
            Automated documentation update — regenerates component and subcomponent docs.
          add-paths: |
            **/*.docs.json
          branch: docs/update-${{ github.run_id }}
          base: master
          delete-branch: true
