name: publish-release

on:
  push:
    branches:
      - master
      - "!dependabot/**/**"
    paths-ignore:
      - "**/package.json"
      - ".yarn/versions/**"
      - "**/*.docs.json"
      - "packages/react/src/prototypes/**"
  workflow_dispatch:

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-packages-npm:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish.outputs.released }}
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-deps

      - name: Create .env file
        run: |
          echo "GITHUB_TOKEN=${{ secrets.PAT_CHANGE_BRANCH_PROTECTION_RULES_FROM_USER_NIMBUS }}" > .env

      - name: Publish packages
        id: publish
        run: yarn publish:stable
        env:
          NODE_OPTIONS: "--max_old_space_size=12288"
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_PUBLISH }}

      - name: Create release PR
        if: steps.publish.outputs.released == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: publish release [skip ci]"
          title: "feat: publish release"
          body: |
            Automated publish release — updates package versions and docs.
          add-paths: |
            packages/**/package.json
            **/*.docs.json
            .yarn/versions/**
          branch: release/publish
          base: master

  create-tag-and-release:
    needs: [publish-packages-npm]
    if: needs.publish-packages-npm.outputs.released == 'true'
    permissions:
      contents: write
      discussions: write
    uses: ./.github/workflows/create-github-tag.yml

  send-slack-notification:
    needs: [publish-packages-npm, create-tag-and-release]
    permissions:
      contents: read
    uses: ./.github/workflows/send-slack-notification.yml
    secrets:
      SLACK_WEBHOOK_URL_NIMBUS_UPDATES: ${{ secrets.SLACK_WEBHOOK_URL_NIMBUS_UPDATES }}
      SLACK_WEBHOOK_URL_DEPLOYING: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOYING }}
      SLACK_WEBHOOK_URL_TECH_PRODUCT_UPDATES: ${{ secrets.SLACK_WEBHOOK_URL_TECH_PRODUCT_UPDATES }}

  generate-documentation:
    needs:
      [publish-packages-npm, create-tag-and-release, send-slack-notification]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/generate-documentation.yml
    # generate-documentation.yml doesn't declare a workflow_call secrets
    # schema (its Turbo credentials are used directly in run: steps, not
    # passed to a nested `uses:`), so explicit per-secret passthrough isn't
    # an option here — inherit is the only way for them to arrive.
    secrets: inherit
