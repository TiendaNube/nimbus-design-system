name: "preview-storybook"

on:
  pull_request:
    # `labeled` lets the storybook-preview label force a build on a pull request
    # whose diff would not have triggered one.
    types: [opened, synchronize, reopened, labeled]

# Two runs on the same pull request would race `aws s3 sync --delete` over one
# prefix, and the slower one would publish the older build under the same link.
concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Every label fires `labeled`, but only one of them means "build this".
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'storybook-preview'

    permissions:
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # The preview used to be gated on a `.yarn/versions/*.yml` carrying a
      # `releases:` entry. That is the wrong signal: the release strategy is
      # decided at the end of the work, while the preview is what you need in the
      # middle of it, so the component under construction had no preview exactly
      # when it was most useful. The gate is now the diff itself.
      - name: Decide whether the preview would show anything new
        id: preview_scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FORCED: ${{ contains(github.event.pull_request.labels.*.name, 'storybook-preview') }}
        run: |
          # Everything that can change a pixel of the built Storybook. Kept
          # generous on purpose: an unnecessary preview costs ~90s of runner
          # time, a missing one costs a review round trip.
          #
          # `packages/core/typings` is included because react-docgen resolves
          # prop types when it generates the autodocs tables. `core/scripts`,
          # `core/webpack` and `packages/helper` are not: they build the npm
          # packages, while Storybook bundles the sources through .storybook.
          #
          # The root `package.json` is deliberately absent: dependency changes
          # always land in `yarn.lock` too, so listing the manifest only added
          # false positives from script and metadata edits, which cannot move a
          # pixel. The uncovered case is an edit to the `build:storybook` flags
          # themselves — rare, and the label covers it.
          #
          # The last two entries are not bundle inputs but preview inputs: they
          # decide what the comment says, and their whole job is to be checked
          # against a real index.json, so a change to them has to produce a
          # preview to be verified against.
          BUILD_INPUTS='^packages/react/|^packages/core/(styles|tokens|typings)/|^packages/icons/|^\.storybook/|^(yarn\.lock|babel\.config\.js|tsconfig\.json)$|^\.scripts/storybook-preview-links\.ts$|^\.github/workflows/preview-storybook\.yml$'

          # Files that never reach the bundle, so never a reason to rebuild on
          # their own: tests, the generated *.docs.json, and documentation.
          NON_VISUAL='\.spec\.(ts|tsx)$|\.docs\.json$|\.md$'

          # Reused by the comment step to deep-link every touched component.
          # Written aside and moved on success: the redirection truncates its
          # target before gh runs, so a failure midway through the pages would
          # otherwise leave a partial list that reads as a complete one.
          if gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/changed-files.partial"; then
            mv "$RUNNER_TEMP/changed-files.partial" "$RUNNER_TEMP/changed-files.txt"
          else
            echo "Could not list the changed files — building the preview anyway."
            rm -f "$RUNNER_TEMP/changed-files.partial"
            : > "$RUNNER_TEMP/changed-files.txt"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "trigger=unavailable-diff" >> "$GITHUB_OUTPUT"
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCED" = "true" ]; then
            echo "Forced by the storybook-preview label."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "trigger=label" >> "$GITHUB_OUTPUT"
            echo "build_mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          relevant=$(grep -vE "$NON_VISUAL" "$RUNNER_TEMP/changed-files.txt" || true)

          # The matched files are the evidence the comment folds away behind its
          # <summary>, so the decision can be audited from the pull request.
          printf '%s\n' "$relevant" | grep -E "$BUILD_INPUTS" \
            > "$RUNNER_TEMP/matched-files.txt" || true

          if [ -s "$RUNNER_TEMP/matched-files.txt" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "trigger=build-inputs" >> "$GITHUB_OUTPUT"
            echo "Building because these files feed the Storybook bundle:"
            cat "$RUNNER_TEMP/matched-files.txt"

            if grep -qvE '^packages/react/src/prototypes/' \
              "$RUNNER_TEMP/matched-files.txt"; then
              echo "build_mode=full" >> "$GITHUB_OUTPUT"
              echo "Using the full Storybook build because the diff reaches beyond prototypes."
            else
              echo "build_mode=prototype" >> "$GITHUB_OUTPUT"
              echo "Using the focused prototype Storybook build."
            fi
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ Storybook preview not built"
              echo "Nothing in this pull request changes what Storybook renders."
              echo "Add the \`storybook-preview\` label to build it anyway."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/setup-node-deps
        if: steps.preview_scope.outputs.should_build == 'true'
        with:
          cache-mode: yarn-cache

      - name: Run build tokens
        if: steps.preview_scope.outputs.should_build == 'true'
        run: npm run build:tokens

      - name: Restore built icons
        if: steps.preview_scope.outputs.should_build == 'true'
        id: icons-cache
        uses: actions/cache@v4
        with:
          path: packages/icons/dist
          key: >-
            ${{ runner.os }}-icons-${{
              hashFiles(
                'packages/icons/src/**',
                'packages/icons/package.json',
                'packages/icons/svgo.config.js',
                'packages/icons/tsconfig.json',
                'packages/icons/webpack.config.ts',
                'packages/core/webpack/src/**',
                'yarn.lock'
              )
            }}

      - name: Run build icons
        if: >-
          steps.preview_scope.outputs.should_build == 'true' &&
          steps.icons-cache.outputs.cache-hit != 'true'
        run: yarn build:icons

      - name: Build Storybook
        if: steps.preview_scope.outputs.should_build == 'true'
        env:
          PREVIEW_BUILD_MODE: ${{ steps.preview_scope.outputs.build_mode }}
        run: |
          if [ "$PREVIEW_BUILD_MODE" = "prototype" ]; then
            STORYBOOK_PROTOTYPE_ONLY=true \
              yarn exec storybook build --test -o .build-storybook
          else
            yarn build:storybook
          fi

      - name: 🔐 Configure AWS credentials using OIDC
        if: steps.preview_scope.outputs.should_build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: us-west-2
          audience: sts.amazonaws.com

      - name: Upload Storybook to S3
        if: steps.preview_scope.outputs.should_build == 'true'
        run: |
          aws s3 sync ./.build-storybook s3://ns-ec-dms-bs3-nimbus-preview/components/pull/${{ github.event.pull_request.number }} --delete

      - name: Comment Storybook preview URL on PR and Check summary
        if: steps.preview_scope.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          STORYBOOK_URL: https://ns-ec-dms-bs3-nimbus-preview.s3.us-west-2.amazonaws.com/components/pull/${{ github.event.pull_request.number }}/index.html
          PREVIEW_TRIGGER: ${{ steps.preview_scope.outputs.trigger }}
          PREVIEW_MATCHED_FILES: ${{ runner.temp }}/matched-files.txt
        run: |
          # The file list comes from the preview_scope step, which already paged
          # through it — the default page size hides files on large pull requests.
          yarn preview:links "$RUNNER_TEMP/changed-files.txt" \
            > "$RUNNER_TEMP/preview-comment.md"
          cat "$RUNNER_TEMP/preview-comment.md"

          echo "Checking for existing Storybook comment..."

          # The marker identifies comments written by this workflow; the legacy
          # pattern keeps pull requests commented before the marker existed from
          # collecting a duplicate. Restricted to bot authors because reviewers
          # quote the preview link routinely, and a PATCH against someone else's
          # comment answers 403 and takes the rest of the step with it.
          # --jq runs per page under --paginate, so the filter emits ids across
          # pages and the pick has to happen afterwards. Assigned without a pipe
          # so the exit status is the one gh returned, not head's; failing to
          # read the comments posts a new one, because a duplicate is
          # recoverable and a missing preview link is not.
          if ! comment_ids=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[]
                  | select(.user.type == "Bot")
                  | select((.body // "") | test("<!-- nimbus-storybook-preview -->")
                                           or test("View Storybook.*pull/'"$PR_NUMBER"'"))
                  | .id'); then
            echo "Could not read the existing comments — posting a new one."
            comment_ids=""
          fi

          comment_id=$(printf '%s\n' "$comment_ids" | head -1)

          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" \
              -F "body=@$RUNNER_TEMP/preview-comment.md"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/preview-comment.md"
          fi

          echo "## 🚀 Storybook Preview Ready" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/preview-comment.md" >> "$GITHUB_STEP_SUMMARY"
