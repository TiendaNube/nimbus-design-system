name: "send-slack-notification"

# Runs on manual dispatch inside nimbus-design-system, and is also callable
# as a reusable workflow from other Nimbus repos (nimbus-patterns).
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL_NIMBUS_UPDATES:
        required: true
      SLACK_WEBHOOK_URL_DEPLOYING:
        required: true
      SLACK_WEBHOOK_URL_TECH_PRODUCT_UPDATES:
        required: true

jobs:
  send-slack-notification:
    runs-on: ubuntu-latest
    # Only needed for the checkout step below; a called workflow can never
    # get more than the caller grants.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Send slack notification on chanel Ninbus updates
        id: slack-nimbus-updates
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload-file-path: ./.github/resources/payload-notification.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_NIMBUS_UPDATES }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send slack notification on chanel Ninbus deploying
        id: slack-deploying
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload-file-path: ./.github/resources/payload-notification.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOYING }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send slack notification on chanel Tech product updates
        id: slack-tech-product-updates
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload-file-path: ./.github/resources/payload-notification.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_TECH_PRODUCT_UPDATES }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
