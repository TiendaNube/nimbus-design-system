name: publish-rc-manual

on:
  workflow_dispatch:
    inputs:
      packages:
        description: |
          Comma-separated list of packages to publish (e.g., @nimbus-ds/button,@nimbus-ds/box).
          Available packages: @nimbus-ds/components, @nimbus-ds/styles, @nimbus-ds/tokens, @nimbus-ds/icons,
          @nimbus-ds/button, @nimbus-ds/box, @nimbus-ds/text, @nimbus-ds/icon, @nimbus-ds/checkbox,
          @nimbus-ds/file-uploader, @nimbus-ds/table, @nimbus-ds/accordion, @nimbus-ds/modal,
          @nimbus-ds/stepper, @nimbus-ds/segmented-control, @nimbus-ds/split-button, @nimbus-ds/scroll-pane,
          @nimbus-ds/slider
        required: true
        type: string
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# The publishing job only needs repository read access from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  publish-rc-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published_packages: ${{ steps.publish.outputs.published_packages }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Checkout
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node-deps

      - name: Create .env file
        run: |
          echo "GITHUB_TOKEN=${{ secrets.PAT_CHANGE_BRANCH_PROTECTION_RULES_FROM_USER_NIMBUS }}" > .env

      - name: Build tokens
        run: yarn build:tokens

      - name: Build icons
        run: yarn build:icons

      - name: Build components
        run: |
          export NODE_OPTIONS="--max_old_space_size=12288"
          yarn build:components

      - name: Build @nimbus-ds/components bundle
        run: |
          export NODE_OPTIONS="--max_old_space_size=12288"
          yarn workspace @nimbus-ds/components build

      - name: Build packages
        run: |
          export NODE_OPTIONS="--max_old_space_size=12288"
          yarn build:packages

      - name: Publish RC packages
        id: publish
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ github.event.inputs.packages }}"
          FAILED=0
          FAILED_PACKAGES=""
          PUBLISHED_PACKAGES="$RUNNER_TEMP/published-packages.md"
          : > "$PUBLISHED_PACKAGES"
          for package in "${PACKAGES[@]}"; do
            package=$(echo "$package" | xargs)
            if [ -n "$package" ]; then
              echo "📦 Publishing RC for $package with bump type: ${{ github.event.inputs.bump_type }}"
              set +e
              echo "y" | yarn publish:rc "$package" "${{ github.event.inputs.bump_type }}" --skip-build | tee "$RUNNER_TEMP/publish-rc.log"
              EXIT_CODE=${PIPESTATUS[1]}
              set -e
              if [ $EXIT_CODE -ne 0 ]; then
                echo "❌ Failed to publish $package (exit code: $EXIT_CODE)"
                FAILED=$((FAILED + 1))
                FAILED_PACKAGES="${FAILED_PACKAGES}${FAILED_PACKAGES:+, }$package"
              else
                PUBLISHED_VERSION=$(sed -nE 's/.*Successfully published[[:space:]]+@?[^@[:space:]]+@([0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+).*/\1/p' "$RUNNER_TEMP/publish-rc.log" | tail -n 1)
                if [ -n "$PUBLISHED_VERSION" ]; then
                  echo "| \`$package\` | \`$PUBLISHED_VERSION\` |" >> "$PUBLISHED_PACKAGES"
                fi
              fi
            fi
          done
          {
            echo "published_packages<<EOF"
            cat "$PUBLISHED_PACKAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "=========================================="
            echo "❌ PUBLISH SUMMARY: $FAILED package(s) failed"
            echo "Failed packages: $FAILED_PACKAGES"
            echo "=========================================="
            exit 1
          fi
          echo "✅ All packages published successfully"
        env:
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTOMATION_PUBLISH }}

  report-published-rc:
    needs: publish-rc-packages
    if: always()
    runs-on: ubuntu-latest
    # The reporting job needs write access to post the publication result on a PR.
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PUBLISHED_PACKAGES: ${{ needs.publish-rc-packages.outputs.published_packages }}
    steps:
      - name: Add publication summary
        run: |
          {
            echo "## 📦 Nimbus RC publication"
            echo ""
            if [ -n "$PUBLISHED_PACKAGES" ]; then
              echo "| Dependency | Generated version |"
              echo "| --- | --- |"
              printf '%s\n' "$PUBLISHED_PACKAGES"
            else
              echo "No RC packages were published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Find associated pull request
        id: pull-request
        run: |
          pull_request_number=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          echo "number=$pull_request_number" >> "$GITHUB_OUTPUT"

      - name: Comment on associated pull request
        if: steps.pull-request.outputs.number != '' && env.PUBLISHED_PACKAGES != ''
        env:
          PULL_REQUEST_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          comment_file="$RUNNER_TEMP/rc-publication-comment.md"
          {
            echo "## 📦 Nimbus RC published"
            echo ""
            echo "The following dependency versions were generated by this RC run:"
            echo ""
            echo "| Dependency | Generated version |"
            echo "| --- | --- |"
            printf '%s\n' "$PUBLISHED_PACKAGES"
            echo ""
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$comment_file"
          gh pr comment "$PULL_REQUEST_NUMBER" --body-file "$comment_file"
