# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Expert code reviewer specializing in TS, React, and Design Systems. Deep knowledge of monorepos and Nimbus. Focus on atomic design, accessibility, and maintainability. Provide precise, actionable feedback on technical implementations."
reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_placeholder: "@autosummary"
  auto_title_placeholder: "@autotitle"
  auto_title_instructions: "Generate a concise PR title following the format 'chore/fix/feat(PackageName): Title' where the type is determined by the nature of changes (chore for maintenance, fix for bug fixes, feat for new features), PackageName is the affected package, if any, and Title is a brief description of the changes."
  auto_apply_labels: true
  poem: false
  collapse_walkthrough: true
  labeling_instructions:
    - label: bug
      instructions: This PR addresses a bug in the project, or fixes an issue that was reported by a user.
    - label: dependencies
      instructions: This PR updates dependencies, such as adding a new dependency or removing an unused one.
    - label: documentation
      instructions: This PR ONLY adds or updates documentation, such as a README, changelog, or inline comments. It does NOT include any production code changes.
    - label: duplicate
      instructions: This PR is a duplicate of another PR. The title and description are identical or very similar to other PRs.
    - label: enhancement
      instructions: This PR implements a new feature or improvement to the project.
  path_filters:
    # Generated by `yarn build:docs` — content is never reviewed, but the
    # "Generated Files Committed" pre-merge check still flags their presence.
    - "!**/*.docs.json"

    # Assets and media
    - "!**/*.svg"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.gif"
    - "!**/*.woff"
    - "!**/*.woff2"
    - "!**/*.ttf"

    # Lock files and dependencies
    - "!**/*.lock"
    - "!**/*.cjs"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"

    # Configuration files
    - "!**/.gitignore"
    - "!**/.eslintrc*"
    - "!**/.prettierrc*"
    # Cursor rules and configuration
    - "!**/cursor/rules/**"

    # IDE and editor files
    - "!**/.vscode/**"
    - "!**/*.swp"
    - "!**/*.swo"
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: |
        Review the React and TypeScript code for adherence to component design system best practices, including:
        - Component reusability, composability, and proper prop interfaces
        - Consistent usage of @nimbus-ds/styles package for styling and theming
        - Accessibility compliance (WCAG guidelines, ARIA attributes, keyboard navigation)
        - Cross-browser compatibility and progressive enhancement
        - Maintain comprehensive JSDoc comments with consistent style, documenting complex logic, and relevant references
        - Full testing coverage (Jest unit tests)
        - Performance optimization (memoization, loops)
        - Responsive design patterns
        - Component scalability and maintainability
        - Proper TypeScript types and interfaces usage
        - Component, prop, and storybook documentation
        Highlight any deviations from these standards.
    - path: "**/CHANGELOG.md"
      instructions: |
        Ensure CHANGELOG.md updates follow the established format: YYYY-MM-DD version with categorized entries (Breaking changes, New features, Bug fixes, Others). 
        Each entry must include PR reference and author, and changes must be properly versioned (major/minor/patch). Changes MUST be documented in their respective package's CHANGELOG.md. 
        **CRITICAL: Clearly highlight and document the package bumps in the summary (or a comment, if unable), following exactly this structure: '@nimbus-ds/<package-name>@<bump-version>|<semver-type>: <Description>.' For example: '@nimbus-ds/styles@9.18.0|minor: Added scroll-pane new composite component...'. It is crucial to respect the requested structure.**

        That bump summary is something YOU produce in the walkthrough. It is never a change
        requested from the author, and it is never a reason to ask for an edit to `package.json`.
        Take the package scope verbatim from the version file (`@nimbus-ds/...`) — do not
        reconstruct it from memory.

        The version in a `CHANGELOG.md` header is the version the release pipeline WILL publish,
        so it legitimately runs ahead of the `version` in `package.json` on an open PR. Never
        report that gap as drift; verify the bump level against `.yarn/versions/*.yml` instead.
    - path: "**/package.json"
      instructions: |
        NEVER suggest editing the `version` field. Versions in this repo are never bumped in
        `package.json`: they are declared as deferred files in `.yarn/versions/*.yml` (created by
        `yarn bump:check --interactive`) and applied by the release pipeline.

        A mismatch between `version` here and the latest header in the package's `CHANGELOG.md`
        is EXPECTED on an open PR — the pipeline has not run yet. It is NOT a finding. Do not ask
        for the two to be "synchronized".

        New packages are seeded once with `"version": "0.0.0"` and declare `major` in the version
        file; the pipeline resolves that to `1.0.0`. Do not ask for `0.0.0` to be changed to
        `1.0.0`, and do not read `0.0.0` as a missing bump.

        AUTOMATED RELEASE PR EXCEPTION: if the branch matches `release/publish-*`, `version`
        changes are the release pipeline applying the deferred declarations and MUST pass. Never
        report those generated manifest updates as manual edits.

        On every other branch, the one `version` finding worth raising is a diff that changes
        `version` for an EXISTING package (a `-"version": "1.2.0"` /
        `+"version": "1.3.0"` hunk, i.e. any edit other than the one-time `"0.0.0"` seed on a
        brand-new package). Flag it as a process violation: that bump belongs in
        `.yarn/versions/*.yml`; hand-editing it here collides with the release pipeline. Ask for
        the manifest edit to be reverted and the level declared in a version file instead.

        The artifact to verify is the `.yarn/versions/*.yml` entry: that the changed package is
        declared, and at the right SemVer level (major for breaking changes, minor for new
        features, patch for bug fixes). Those files sit under a default-excluded path, so their
        contents are not in the reviewable diff — read them from the repository before concluding
        that a declaration is missing, and never infer their absence from the diff body alone.

        Do review `dependencies` and `peerDependencies` ranges normally.
    - path: "**/packages/react/src/atomic/**/*.{ts,tsx}"
      instructions: |
        Review atomic components for dependency management in monorepo context:
        - Evaluate if the component is a common dependency across multiple packages
        - If widely used as a dependency, recommend adding the package name to the 'externals' attribute in webpack.config
        - This prevents the component from being bundled multiple times across different packages
        - Ensure proper package naming and versioning for external configuration
        - Verify that the component is properly exported and consumed by dependent packages. **IMPORTANT** Constants declared within the package must be exported in order to be included in the final published build.
        - Check for circular dependencies and proper dependency tree structure
        Flag components that should be added to webpack 'externals' to optimize bundle size and prevent duplicate code in the monorepo build.
    - path: "**/*.types.ts"
      instructions: |
        Review TypeScript type definitions following these standards:
        - Always export a 'ComponentNameProperties' interface, where the ComponentName is the name of the component. This interface should NOT inherit HTMLElement properties or BoxProperties, not any big interface as it will be used for documentation. It should ONLY contain the specific props this component defines.
        - Prefer type aliases for unions, intersections, and simple object types
        - Keep types and interfaces focused and single-purpose
        - Use proper JSDoc comments for all exported types
        - Leverage TypeScript utility types when appropriate (Partial, Pick, Omit)
        - Ensure type names are descriptive and follow PascalCase convention
        - Avoid type 'any' - use 'unknown' for truly unknown types
        Flag any deviations from these patterns.
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "DRAFT"
      - "WIP"
      - "DO NOT MERGE"
    labels: []
    drafts: false
    base_branches:
      - "master"
  pre_merge_checks:
    docstrings:
      mode: "warning"
      threshold: 70
    title:
      mode: "warning"
      requirements: "Follow format 'chore/fix/feat(PackageName): Title'. Use 'feat!' prefix for breaking changes."
    description:
      mode: "warning"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "Unversioned Breaking Changes"
        mode: "error"
        instructions: |
          Pass/fail criteria: All breaking changes MUST be declared as `major` for the affected
          package in a `.yarn/versions/*.yml` file.

          Versions are NEVER bumped in `package.json` in this repo — the release pipeline applies
          them from the deferred version files. Do not look at `package.json` for the bump, and do
          not ask the author to edit it. `.yarn/**` is excluded from the reviewable diff by
          default, so read the version files from the repository rather than from the diff body.

          Detect breaking changes by scanning for:
          1. **Props API changes** in *.types.ts: Removed props, renamed props, type narrowing (e.g., `string | number` → `string`), optional→required changes
          2. **Export removals** in index.ts: Any previously exported symbol (component, type, hook, utility) removed
          3. **Token changes** in packages/core/tokens/src/**/*.json: Removed or renamed token keys
          4. **Default value changes**: Changed defaultProps or default parameter values that alter behavior
          5. **CSS breaking changes**, per items 1-5 of the "Undocumented CSS Breaking Changes"
             check below — a removed or renamed export/identifier, a removed variant option, a
             changed `defaultVariants`, or a token reference remapped to a different token

          A `*.css.ts` file being touched is never, by itself, a breaking change — only actually
          matching item 5 above makes it breaking. That check's own item 6 (a layout-affecting
          value changed with nothing removed or renamed) requires CHANGELOG documentation there,
          not a MAJOR bump here — whether it should is a separate, not-yet-made call; do not
          extend item 5 to cover it without that decision.

          PASS if: No breaking changes detected, OR every affected package is declared `major` in a
          `.yarn/versions/*.yml` file
          FAIL if: Breaking changes detected but the version file declares `minor` or `patch` for
          that package, or declares nothing for it, or the PR carries no version file at all

          A brand-new package is a special case, not a failure: its `package.json` is seeded with
          `"version": "0.0.0"` and the version file declares `major`, which the pipeline resolves
          to `1.0.0`. Adding a new package is not itself a breaking change.

          When failing, quote the version file and the exact line to change, e.g.
          `"@nimbus-ds/title": major`.
      - name: "Missing @nimbus-ds/components Release"
        mode: "error"
        instructions: |
          Pass/fail criteria: a PR that changes component source MUST also declare a release
          for `@nimbus-ds/components`.

          `@nimbus-ds/components` is the workspace at `packages/react`. It is the aggregate
          package that ships every component, and it builds by bundling the component
          *sources* (`packages/react/webpack.config.ts` derives its webpack entries from
          `src/atomic` and `src/composite`). Because `packages/react/package.json` does not
          declare the component workspaces as dependencies, `yarn version check` never offers
          or requires this bump — it will not even appear in the `declined` list. Nothing else
          in CI catches it, so this check is the only guard.

          Trigger: the PR adds or modifies published source under
          `packages/react/src/atomic/*/src/**` or `packages/react/src/composite/*/src/**` —
          that is `*.ts`, `*.tsx` or `*.css.ts`, EXCLUDING `*.spec.tsx`, `*.spec.ts`,
          `*.stories.tsx` and `*.docs.json`, which are not published.

          `.yarn/**` is excluded from the reviewable diff by default, so the version files are
          not in the diff body. Read them from the repository — never infer the presence, absence
          or level of a declaration from the diff.

          PASS if: no published component source changed, OR some `.yarn/versions/*.yml` in
          the PR has `"@nimbus-ds/components"` under `releases:` with a bump level at least as
          high as the required level computed below (major > minor > patch). Also PASS for the
          automated release PR (branch `release/publish-*`).

          EXCEPTION for a brand-new component package (its `package.json` is added in this PR,
          seeded with `"version": "0.0.0"`): its `major` is only the seed resolving to `1.0.0`, so
          it does not raise the required level for the aggregate — do not demand `major` to
          satisfy "at least as high". Adding a component breaks nothing for aggregate consumers.
          Precedent: #400 (`slider`), #414 (`time-picker`), #319 (`scroll-pane`) and #290
          (`segmented-control`) all pair the new package's `major` with `components: minor`.

          Compute the required level from the changed EXISTING component packages. If the PR also
          adds a new component package seeded at `"version": "0.0.0"`, raise that level to at least
          `minor`, since the new component is a feature of the aggregate. Do not apply this `minor`
          floor when the PR changes only existing component packages. So in a MIXED PR — a new
          package declared `major` alongside an existing component that also needs `major` — the
          existing component's `major` still governs and `"@nimbus-ds/components": minor` FAILS.
          When the only component change is a new `0.0.0` package, `minor` is correct; when the PR
          only patches existing components, a matching `patch` on the aggregate is correct.

          FAIL if: published component source changed and `@nimbus-ds/components` is missing
          from `releases:`, or is declared below the required level computed above.

          When failing, quote the version file and the exact line to add, e.g.
          `"@nimbus-ds/components": minor`. Cite the precedent: PR #462 changed Badge without
          it, and PR #497 had to be opened solely to declare the missed bump (see also #440
          "bump react for a missing change" and #464 "republish packages").

          Secondary: if the PR declares a component release, also verify the change is
          documented in `packages/react/CHANGELOG.md`, not only in the component's own
          `CHANGELOG.md`. Report that as a separate, lower-priority note.
      - name: "Generated Files Committed"
        mode: "warning"
        instructions: |
          Pass/fail criteria: a feature PR MUST NOT include generated build artifacts.

          The generated artifact to look for is `**/*.docs.json` (e.g.
          `packages/react/src/atomic/Title/src/title.docs.json`), produced by
          `yarn build:docs` (`.scripts/json-documentation.ts` running Docgen).

          Inspect the PR's changed-file list (this path is excluded from content review by
          `path_filters`, so rely on the file list, not the diff body).

          PASS if: no generated artifact appears in the changed-file list, OR the PR is the
          automated release PR (branch `release/publish-*`, title "feat: publish release")
          or the automated documentation commit ("chore: updated documentation for
          components and subcomponents").

          FAIL if: any `*.docs.json` is added/modified in a regular feature/fix/chore PR.

          When failing, list the generated files and tell the author to revert them with
          `git restore --source=HEAD --staged --worktree -- '**/*.docs.json'` followed by
          `git clean -f -- '**/*.docs.json'` (the second command is needed because a newly
          added component's `*.docs.json` is untracked, so `restore` alone leaves it staged by
          `git add -A`), explaining that:
          - CI regenerates them: `publish.yml` rebuilds docs on master and ships them in the
            automated release PR; `pull-request.yml` builds them only as validation and
            discards the diff.
          - Committing them by hand causes conflicts with that release PR.
          - `publish.yml` lists `**/*.docs.json` under `paths-ignore`, so pushes touching
            only those paths never trigger `publish-release`.

          Do NOT try to infer hand-editing from the absence of a `*.types.ts` change. A
          `*.docs.json` is generated from three inputs — the `ComponentNameProperties`
          interface in `*.types.ts`, the `PolymorphicForwardRefComponent<…>` signature in the
          component's `.tsx`, and the `version` in that package's `package.json` — so a
          version bump alone legitimately changes it. The finding is "a generated file is in
          this PR at all", nothing more.
      - name: "Undocumented CSS Breaking Changes"
        mode: "error"
        instructions: |
          Pass/fail criteria: All CSS/styling breaking changes MUST be documented in CHANGELOG.md under "🛠 Breaking changes" section.
          
          Scan *.css.ts files (Vanilla-Extract) for:
          1. Removed exports: styleVariants, recipe, globalStyle, createVar removals
          2. Removed variant options from recipe() (e.g., size: { small, medium, large } → { small, medium })
          3. Renamed CSS class identifiers or CSS variables (--nimbus-*)
          4. Changed defaultVariants in recipe()
          5. A token reference deliberately remapped to a semantically different token (e.g.,
             vars.colors.primary → vars.colors.brand) — replacing a hardcoded value, or an
             incorrect token, with the token the component's contract already specifies is a
             conformity fix, not this
          6. Changed the *value* of an existing layout-affecting declaration — dimensions,
             display, position, or overflow — on a public component's style, even with no
             identifier removed or renamed (e.g. height: '32px' → '40px', display: 'block' →
             'flex'); adding a previously-missing declaration that restores a documented contract
             is a conformity fix, not this

          PASS if: No CSS breaking changes detected, OR all CSS breaking changes are documented in CHANGELOG.md with "🛠 Breaking changes" section
          FAIL if: CSS breaking changes found but CHANGELOG.md lacks documentation or "🛠 Breaking changes" section is missing
          
          CSS breaking changes are often overlooked - this check ensures they are properly documented for consumers.
      - name: "Breaking Change Documentation Verification"
        mode: "error"
        instructions: |
          Pass/fail criteria: If a `.yarn/versions/*.yml` declares `major` for an EXISTING package
          OR code contains breaking changes, that package's CHANGELOG.md MUST have a
          "#### 🛠 Breaking changes" section.

          `.yarn/**` is excluded from the reviewable diff by default, so the version files are not
          in the diff body. Read them from the repository — never infer the presence, absence or
          level of a declaration from the diff.

          Cross-reference:
          1. Check if any `.yarn/versions/*.yml` in the PR declares `major` for a package. Never
             look at `package.json` for this — versions there are applied by the release pipeline,
             not by the author. A new package seeded at `"version": "0.0.0"` with a `major`
             declaration is an initial release, so it needs no breaking-changes section.
          2. Check if breaking changes detected in code: props removed, exports removed, a
             token key removed or renamed in `packages/core/tokens/src/**/*.json` (per
             "Unversioned Breaking Changes" item 3), or a CSS breaking change per the
             "Undocumented CSS Breaking Changes" check above: removed `styleVariants`,
             `recipe`, `globalStyle`, or `createVar` declarations; removed variant options;
             renamed CSS class or CSS variable (`--nimbus-*`) identifiers; a changed
             `defaultVariants`; a token reference deliberately remapped to a semantically
             different token; or the *value* of an existing layout-affecting declaration
             (dimensions, display, position, overflow) changed on a public component's style. A
             `*.css.ts` file being touched is never, by itself, a breaking change — e.g. adding a
             property that was previously implicit or inherited, such as an explicit `height` on
             an existing style object, removing and renaming nothing, is not breaking; nor is
             replacing a hardcoded value or an incorrect token with the token the component's
             contract already specifies. Conversely, a one-line change IS breaking if that line
             matches any criterion above.
          3. Verify CHANGELOG.md contains "#### 🛠 Breaking changes" or "### 🛠 Breaking changes" section
          4. Verify each breaking change is documented with description and PR reference

          Evaluate PER PACKAGE, never over the PR as a whole — an exempt package must not carry
          the whole PR. A package is "affected" if it has a `major` declaration in a version file
          or a breaking change detected in its code.

          PASS if EVERY affected package satisfies one of:
          - it is a new package seeded at `"version": "0.0.0"` whose `major` is its initial
            release — no breaking-changes section required; or
          - it is an existing package, and its own CHANGELOG.md has the required
            "🛠 Breaking changes" section documenting the change.

          PASS trivially if there is no affected package at all.

          FAIL if ANY affected existing package lacks that section — whether the trigger was its
          `major` declaration, a breaking change detected in its code, or both. A new `0.0.0`
          package being exempt never excuses a co-changed existing package.
          
          Documentation format required: "- Description of breaking change. ([#PR](url) by [@author](url))"
  tools:
    github-checks:
      enabled: true
      timeout_ms: 30000
    # Linting
    biome:
      enabled: true
    # Yaml linting
    yamllint:
      enabled: true
    eslint:
      enabled: true
    # GH Actions
    actionlint:
      enabled: true
    # Security vulnerabilities and code quality issues
    semgrep:
      enabled: true
    # JS/TS linting
    oxc:
      enabled: true
chat:
  auto_reply: true
knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: auto
  pull_requests:
    scope: auto
