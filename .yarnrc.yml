changesetBaseRefs:
  - master
  - origin/master
  - upstream/master

changesetIgnorePatterns:
  - "**/*.spec.{ts,tsx}"
  - "**/*.stories.{ts,tsx}"
  - "packages/react/src/prototypes/**"

nodeLinker: node-modules

# registry.yarnpkg.com (Yarn's default when unset) is a read-only mirror of
# npm — GET works, but PUT (publish) 404s. Point publishes at the real
# registry explicitly instead of relying on the unstated default.
npmRegistryServer: "https://registry.npmjs.org"

preferDeferredVersions: true

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-workspace-tools.cjs
    spec: "@yarnpkg/plugin-workspace-tools"
  - path: .yarn/plugins/@yarnpkg/plugin-version.cjs
    spec: "@yarnpkg/plugin-version"
  - path: .yarn/plugins/@yarnpkg/plugin-typescript.cjs
    spec: "@yarnpkg/plugin-typescript"

yarnPath: .yarn/releases/yarn-3.2.2.cjs
